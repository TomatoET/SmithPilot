name: Bug report
description: Report a reproducible SmithPilot problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include serial numbers, private paths, network addresses, or confidential measurement data.
  - type: input
    id: version
    attributes:
      label: SmithPilot version
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, Python version, and packaged or source run
    validations:
      required: true
  - type: input
    id: instrument
    attributes:
      label: Instrument
      description: Model and firmware only; omit the serial number and IP address
      placeholder: E5071C, firmware A.xx.xx
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed serial numbers, private paths, network addresses, and confidential data.
          required: true
