name: Feature request
description: Propose a SmithPilot workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow problem, not only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and SCPI impact
      description: Include affected instrument models and commands when known.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
