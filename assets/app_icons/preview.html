<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmithPilot Final Icons</title>
  <style>
    body { margin: 0; background: #f6f8fb; color: #172033; font-family: "Segoe UI", Arial, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 18px; font-size: 22px; font-weight: 650; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    section { border: 1px solid #dce5f0; border-radius: 12px; background: #fff; padding: 18px; }
    h2 { margin: 0 0 14px; font-size: 16px; }
    .tile { display: grid; min-height: 180px; place-items: center; border: 1px solid #e5ebf2; border-radius: 10px; background: #fbfcfe; }
    img.app { width: 128px; height: 128px; }
    img.window { width: 64px; height: 64px; }
    p { color: #667085; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>SmithPilot final window and app icons</h1>
    <div class="grid">
      <section><h2>Application icon</h2><div class="tile"><img class="app" src="app-icon-256.png" alt=""></div><p>Full reference mark with SmithPilot wordmark.</p></section>
      <section><h2>Window icon</h2><div class="tile"><img class="window" src="window-icon-256.png" alt=""></div><p>Same mark, cropped to the SP core for title bar readability.</p></section>
    </div>
  </main>
</body>
</html>
