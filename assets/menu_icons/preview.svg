<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="430" viewBox="0 0 1020 430" role="img" aria-label="SmithPilot menu icon options">
  <rect width="1020" height="430" fill="#f6f8fb"/>
  <text x="32" y="44" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650">SmithPilot menu icon options</text>

  <g transform="translate(32 72)">
