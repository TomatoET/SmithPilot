    <text x="18" y="50" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif" font-size="13">Each icon sits inside a small instrument-panel frame, more branded and technical.</text>
    <g transform="translate(348 20)">
      <g transform="translate(0 0)"><rect width="84" height="58" rx="6" fill="#fbfcfe" stroke="#e4e9f0"/><image href="set_c_panel/connection.svg" x="26" y="8" width="32" height="32"/><text x="42" y="50" text-anchor="middle" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="11">Connect</text></g>
      <g transform="translate(96 0)"><rect width="84" height="58" rx="6" fill="#fbfcfe" stroke="#e4e9f0"/><image href="set_c_panel/setup.svg" x="26" y="8" width="32" height="32"/><text x="42" y="50" text-anchor="middle" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="11">Setup</text></g>
      <g transform="translate(192 0)"><rect width="84" height="58" rx="6" fill="#fbfcfe" stroke="#e4e9f0"/><image href="set_c_panel/calibration.svg" x="26" y="8" width="32" height="32"/><text x="42" y="50" text-anchor="middle" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="11">Cal</text></g>
      <g transform="translate(288 0)"><rect width="84" height="58" rx="6" fill="#fbfcfe" stroke="#e4e9f0"/><image href="set_c_panel/port-extension.svg" x="26" y="8" width="32" height="32"/><text x="42" y="50" text-anchor="middle" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="11">Extension</text></g>
      <g transform="translate(384 0)"><rect width="84" height="58" rx="6" fill="#fbfcfe" stroke="#e4e9f0"/><image href="set_c_panel/dut-measurement.svg" x="26" y="8" width="32" height="32"/><text x="42" y="50" text-anchor="middle" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="11">DUT</text></g>
      <g transform="translate(480 0)"><rect width="84" height="58" rx="6" fill="#fbfcfe" stroke="#e4e9f0"/><image href="set_c_panel/log.svg" x="26" y="8" width="32" height="32"/><text x="42" y="50" text-anchor="middle" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="11">Log</text></g>
