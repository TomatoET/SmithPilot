      <g transform="translate(96 0)"><rect width="84" height="58" rx="6" fill="#fbfcfe" stroke="#e4e9f0"/><image href="set_a_line/setup.svg" x="26" y="8" width="32" height="32"/><text x="42" y="50" text-anchor="middle" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="11">Setup</text></g>
      <g transform="translate(192 0)"><rect width="84" height="58" rx="6" fill="#fbfcfe" stroke="#e4e9f0"/><image href="set_a_line/calibration.svg" x="26" y="8" width="32" height="32"/><text x="42" y="50" text-anchor="middle" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="11">Cal</text></g>
      <g transform="translate(288 0)"><rect width="84" height="58" rx="6" fill="#fbfcfe" stroke="#e4e9f0"/><image href="set_a_line/port-extension.svg" x="26" y="8" width="32" height="32"/><text x="42" y="50" text-anchor="middle" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="11">Extension</text></g>
      <g transform="translate(384 0)"><rect width="84" height="58" rx="6" fill="#fbfcfe" stroke="#e4e9f0"/><image href="set_a_line/dut-measurement.svg" x="26" y="8" width="32" height="32"/><text x="42" y="50" text-anchor="middle" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="11">DUT</text></g>
